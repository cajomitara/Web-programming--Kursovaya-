events {}

http {
    server {
        listen 80;

        # общие заголовки для всех проксируемых запросов
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ---------- сервис авторизации ----------
        # вход, выход, текущий пользователь
        location /api/users/ {
            proxy_pass http://auth:8000;
        }

        # админка пользователей и её статика (/auth/admin/, /auth/static/)
        location /auth/ {
            proxy_pass http://auth:8000;
        }

        # внутренний API сервиса авторизации наружу не публикуется
        location /internal/ {
            return 404;
        }

        # ---------- основной backend ----------
        location /api/ {
            proxy_pass http://backend:8000;
        }

        location /admin/ {
            proxy_pass http://backend:8000;
        }

        location /static/ {
            proxy_pass http://backend:8000;
        }

        location /media/ {
            proxy_pass http://backend:8000;
        }

        # ---------- клиентское приложение ----------
        location / {
            proxy_pass http://frontend:80;
        }
    }
}
