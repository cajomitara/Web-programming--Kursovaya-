services:
  backend:
    build: .
    image: cajodev/dotaesports:backend-${TAG:-latest}
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DB_PATH: /app/data/db.sqlite3
    ports:
      - "8001:8000"
    volumes:
      - sqlite_data:/app/data

  frontend:
    build: ./client
    image: cajodev/dotaesports:frontend-${TAG:-latest}
    ports:
      - "5174:5173"

  nginx:
    build: ./nginx
    image: cajodev/dotaesports:nginx-${TAG:-latest}
    ports:
      - "81:80"
    depends_on:
      - backend
      - frontend

volumes:
  sqlite_data: