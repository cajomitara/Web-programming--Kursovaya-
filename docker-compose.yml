services:
  backend:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DB_PATH: /app/data/db.sqlite3
    volumes:
      - sqlite_data:/app/data

  frontend:
    build: ./client

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  sqlite_data: